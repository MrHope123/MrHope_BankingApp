spring.application.name=MrHope_BankingApp
server.port=8080

# In-memory H2 database: no installation or credentials needed.
# Data is reset every time the app restarts.
spring.datasource.url=jdbc:h2:mem:bankdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 web console at http://localhost:8080/h2-console (JDBC URL above)
spring.h2.console.enabled=true

lombok.config.file=lombok.config
