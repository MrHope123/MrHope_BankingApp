spring.application.name=MrHope_BankingApp
server.port=8080

# In-memory H2 database: no installation or credentials needed.
# Data is reset every time the app restarts.
spring.datasource.url=jdbc:h2:mem:bankdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# The H2 console is off because it would expose the database without a login.
# Switch it on locally only if you need it (and add it to the security rules).
spring.h2.console.enabled=false

lombok.config.file=lombok.config

# JWT signing key (HS256). In any real deployment set the JWT_SECRET environment
# variable to a random value of at least 32 characters. If it is not set, a random
# key is generated at startup, so every token stops working when the app restarts.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiry-minutes=60
